<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sin conexión — Caetutti Protocol</title>
  <link rel="icon" href="/caetutti-logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #050807;
      color: #d4d4d4;
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .box {
      max-width: 460px;
      width: 100%;
      border: 1px solid rgba(0, 255, 65, 0.25);
      background: rgba(10, 15, 12, 0.85);
      padding: 28px;
      position: relative;
    }
    .box::before, .box::after,
    .corner-tl, .corner-br { content: ""; position: absolute; width: 14px; height: 14px; }
    .corner-tl { top: -1px; left: -1px; border-top: 1px solid #00ff41; border-left: 1px solid #00ff41; }
    .corner-br { bottom: -1px; right: -1px; border-bottom: 1px solid #00ff41; border-right: 1px solid #00ff41; }
    h1 { color: #00ff41; font-size: 20px; margin: 12px 0 8px; text-shadow: 0 0 12px rgba(0,255,65,.4); }
    p { font-size: 13px; line-height: 1.7; color: #9ca3af; margin-bottom: 10px; }
    .log { font-size: 12px; line-height: 1.9; margin-top: 18px; }
    .ok { color: #00ff41; }
    .warn { color: #f59e0b; }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      background: #00ff41;
      color: #050807;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
    }
    button:active { opacity: .8; }
    .logo { width: 56px; height: 56px; object-fit: contain; }
    .safe { color: #00ff41; }
  </style>
</head>
<body>
  <div class="box">
    <span class="corner-tl"></span><span class="corner-br"></span>
    <img class="logo" src="/caetutti-logo.png" alt="Caetutti Dynamics" />
    <h1>&gt; SIN CONEXIÓN</h1>
    <p>No se pudo contactar al servidor. <span class="safe">Tus registros y progresos están a salvo</span> — todo queda guardado en la base de datos del servidor, no en este dispositivo.</p>
    <div class="log">
      <div class="ok">[ OK ] Datos del servidor: intactos</div>
      <div class="ok">[ OK ] Sesión: se mantiene</div>
      <div class="warn">[ WARN ] Conexión de red: requerida</div>
    </div>
    <button onclick="location.reload()">REINTENTAR CONEXIÓN</button>
  </div>
</body>
</html>
